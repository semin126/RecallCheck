<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RecallCheck — 암기 채점기</title>
<style>
  :root{
    --ink:#22262b;
    --ink-soft:#5c6470;
    --line:#dfe3e0;
    --paper:#ffffff;
    --wash:#f4f7f4;
    --green:#1f7a4d;
    --green-soft:#e6f2ea;
    --orange:#d9761f;
    --orange-soft:#fdf0e2;
    --yellow:#f0c033;
    --yellow-soft:#fdf7e0;
    --gray-soft:#eef0ef;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    font-size:16.5px;
    line-height:1.8;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:860px;margin:0 auto;padding:0 22px 90px}

  /* 머리말: 공책 위쪽 여백선 느낌 */
  header{border-bottom:2px solid var(--green);margin-bottom:26px}
  .head-in{max-width:860px;margin:0 auto;padding:20px 22px 14px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .brand{font-size:1.22rem;font-weight:700;letter-spacing:-.02em}
  .brand span{color:var(--green)}
  .crumbs{color:var(--ink-soft);font-size:.9rem}
  .crumbs b{color:var(--ink);font-weight:600}

  h2{font-size:1.26rem;margin:0 0 4px;letter-spacing:-.02em}
  h3{font-size:1.02rem;margin:26px 0 10px}
  p.lead{color:var(--ink-soft);margin:0 0 22px}

  button{font-family:inherit;font-size:inherit;cursor:pointer}
  .btn{border:1.5px solid var(--line);background:#fff;color:var(--ink);
       border-radius:9px;padding:9px 16px;line-height:1.5}
  .btn:hover{border-color:var(--ink-soft)}
  .btn:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .btn-go{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
  .btn-go:hover{background:#1a6741;border-color:#1a6741}
  .btn-mark{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600}
  .btn-mark:hover{background:#c06716;border-color:#c06716}
  .btn-sm{padding:5px 11px;font-size:.88rem;border-radius:7px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .link{background:none;border:0;color:var(--green);padding:4px 0;text-decoration:underline;text-underline-offset:3px}

  input[type=text],textarea,select{
    font-family:inherit;font-size:inherit;color:var(--ink);
    border:1.5px solid var(--line);border-radius:9px;padding:10px 13px;background:#fff;width:100%;
  }
  textarea{line-height:1.8;resize:vertical}
  input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--green)}

  /* 세트 카드: 색인표처럼 왼쪽 굵은 선 */
  .sets{display:grid;gap:11px;margin:18px 0}
  .set{display:flex;justify-content:space-between;align-items:center;gap:12px;
       width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);
       border-left:6px solid var(--green);border-radius:10px;padding:14px 16px}
  .set:hover{background:var(--wash)}
  .set .nm{font-weight:600}
  .set .ct{color:var(--ink-soft);font-size:.88rem;white-space:nowrap}

  .empty{border:1.5px dashed var(--line);border-radius:12px;padding:24px 22px;background:var(--wash)}
  .empty pre{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;
             overflow-x:auto;font-size:.88rem;line-height:1.75;margin:8px 0 0}

  /* 할 일 고르기 */
  .tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:11px;margin:14px 0 8px}
  .tool{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:14px 16px}
  .tool:hover{background:var(--wash);border-color:var(--ink-soft)}
  .tool b{display:block;font-size:1.02rem;margin-bottom:2px}
  .tool span{color:var(--ink-soft);font-size:.9rem;line-height:1.65;display:block}

  .picker{border:1.5px solid var(--line);border-radius:11px;margin:14px 0 4px;overflow:hidden}
  .picker-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;
              padding:11px 14px;background:var(--wash);border-bottom:1.5px solid var(--line)}
  .picker-top .cnt{margin-left:auto;color:var(--ink-soft);font-size:.9rem}
  .q-list{max-height:330px;overflow-y:auto}
  .q-item{display:flex;gap:11px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line)}
  .q-item:last-child{border-bottom:0}
  .q-item:hover{background:var(--wash)}
  .q-item input{margin-top:8px;width:17px;height:17px;accent-color:var(--green);flex:none}
  .q-item .num{color:var(--ink-soft);font-variant-numeric:tabular-nums;flex:none;min-width:1.9em}
  .q-item .txt{flex:1}
  .q-item .txt small{display:block;color:var(--ink-soft);font-size:.86rem}

  /* 플래시카드 */
  .card{border:1.5px solid var(--line);border-left:6px solid var(--yellow);border-radius:12px;
        padding:30px 26px;min-height:210px;display:flex;flex-direction:column;justify-content:center;
        background:#fff;text-align:center}
  .card.open{border-left-color:var(--green);background:var(--green-soft)}
  .card .qt{font-size:1.14rem;font-weight:600;margin-bottom:14px}
  .card .at{color:var(--ink);border-top:1px dashed var(--line);padding-top:14px;text-align:left}
  .card .hint{color:var(--ink-soft);font-size:.9rem}
  .prog{height:5px;background:var(--gray-soft);border-radius:99px;margin:16px 0 12px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--green);border-radius:99px}

  /* 문서 읽기 */
  .doc{border-top:1px solid var(--line)}
  .doc .d{border-bottom:1px solid var(--line);padding:14px 0 14px 16px;border-left:3px solid var(--gray-soft)}
  .doc .d b{display:block}
  .doc .d span{color:var(--ink-soft)}

  /* 채점 */
  .res{border:1.5px solid var(--line);border-radius:11px;padding:15px 17px;margin-bottom:11px}
  .res.ok{border-left:6px solid var(--green)}
  .res.half{border-left:6px solid var(--yellow)}
  .res.no{border-left:6px solid var(--orange)}
  .res .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
  .res .vd{font-weight:700}
  .res.ok .vd{color:var(--green)} .res.half .vd{color:#a9820e} .res.no .vd{color:var(--orange)}
  .res .sim{color:var(--ink-soft);font-size:.9rem;font-variant-numeric:tabular-nums}
  .res .qz{font-weight:600;margin-bottom:8px}
  .res .mine{background:var(--wash);border-radius:8px;padding:10px 13px;margin:6px 0}
  .res .ansbox{background:var(--green-soft);border-radius:8px;padding:10px 13px;margin-top:8px}
  .sub{background:var(--orange-soft);color:var(--orange);border-bottom:2px solid var(--orange);
       border-radius:3px;padding:0 2px}
  .extra{color:var(--ink-soft);text-decoration:line-through}
  .miss{background:var(--yellow-soft);border-bottom:2px solid var(--yellow);border-radius:3px;
        padding:0 3px;color:#8a6a05}
  /* 무엇이 틀렸는지 먼저 */
  .errhead{font-weight:600;margin:2px 0 7px}
  ul.errs{list-style:none;margin:0 0 12px;padding:0}
  ul.errs li{position:relative;padding-left:15px;margin-bottom:3px;line-height:1.7}
  ul.errs li:before{content:"";position:absolute;left:0;top:.72em;width:7px;height:7px;border-radius:50%}
  ul.errs li.red:before{background:var(--orange)}
  ul.errs li.yellow:before{background:var(--yellow)}
  ul.errs li.gray:before{background:#b6bcc2}
  ul.errs .tag{display:inline-block;min-width:6.4em;color:var(--ink-soft);font-size:.88rem}
  ul.errs b{font-weight:600}
  ul.errs s{color:var(--ink-soft)}
  .okline{color:var(--green);font-weight:600;margin-bottom:8px}
  .sbs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  @media (max-width:620px){.sbs{grid-template-columns:1fr}}
  .sbs .col{background:var(--wash);border-radius:9px;padding:9px 12px}
  .sbs .col:first-child{background:var(--green-soft)}
  .sbs .lbl{display:block;font-size:.84rem;color:var(--ink-soft);margin-bottom:3px}
  .sbs .txt{line-height:1.85}
  .done{background:var(--green-soft);border-left:5px solid var(--green);border-radius:0 10px 10px 0;
        padding:14px 17px;margin:18px 0 12px;font-weight:600;color:var(--green)}
  .ck{width:14px;height:14px;vertical-align:-2px;flex:none}
  .ck-lg{width:17px;height:17px;vertical-align:-3px}
  .hist{border:1.5px solid var(--line);border-radius:11px;overflow:hidden;margin:14px 0 4px}
  .hist .hrow{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
  .hist .hrow:last-child{border-bottom:0}
  .hist .when{color:var(--ink-soft);font-size:.88rem;min-width:8.6em}
  .hist .sc{font-weight:600}
  .hist .sc small{font-weight:400;color:var(--ink-soft)}
  .hist .hrow button{margin-left:auto}
  .grid{display:flex;flex-wrap:wrap;gap:5px;padding:4px 14px 13px}
  .grid span{display:inline-flex;align-items:center;justify-content:center;min-width:27px;height:27px;
             border-radius:7px;font-size:.85rem;font-variant-numeric:tabular-nums}
  .grid .g-ok{background:var(--green-soft);color:var(--green);font-weight:600}
  .grid .g-half{background:var(--yellow-soft);color:#8a6a05}
  .grid .g-no{background:var(--orange-soft);color:var(--orange)}
  .opts{border:1.5px solid var(--line);border-radius:11px;padding:14px 16px;margin:12px 0}
  .opts label{display:inline-flex;align-items:center;gap:7px;margin:5px 18px 5px 0;font-size:.95rem}
  .opts input[type=checkbox]{width:17px;height:17px;accent-color:var(--green)}
  .score{background:var(--wash);border-radius:11px;padding:16px 18px;margin-bottom:18px}
  .score b{font-size:1.5rem;font-variant-numeric:tabular-nums}

  /* DP 표 */
  .dpwrap{overflow-x:auto;margin-top:10px}
  table.dp{border-collapse:collapse;font-size:.8rem;font-variant-numeric:tabular-nums}
  table.dp th,table.dp td{border:1px solid var(--line);padding:3px 7px;text-align:center;min-width:30px}
  table.dp th{background:var(--wash);font-weight:600;font-size:.78rem}
  table.dp td.path{background:var(--green-soft);font-weight:700;color:var(--green)}

  /* 사진 채점 표 */
  table.sheet{width:100%;border-collapse:collapse}
  table.sheet th,table.sheet td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
  table.sheet th{font-size:.88rem;color:var(--ink-soft);font-weight:600}
  table.sheet td.n{color:var(--ink-soft);font-variant-numeric:tabular-nums;width:2.4em}
  table.sheet textarea{min-height:46px;padding:7px 10px;border-radius:7px}
  .thumbs{display:flex;gap:9px;flex-wrap:wrap;margin:12px 0}
  .thumbs figure{margin:0;width:104px}
  .thumbs img{width:104px;height:104px;object-fit:cover;border-radius:9px;border:1.5px solid var(--line);display:block}
  .thumbs figcaption{font-size:.78rem;color:var(--ink-soft);text-align:center;margin-top:3px;
                     overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note{background:var(--yellow-soft);border-left:4px solid var(--yellow);border-radius:0 9px 9px 0;
        padding:12px 15px;margin:14px 0;font-size:.94rem;line-height:1.75}
  .warn{background:var(--orange-soft);border-left:4px solid var(--orange);border-radius:0 9px 9px 0;
        padding:12px 15px;margin:12px 0;font-size:.94rem}
  .spin{display:inline-block;width:15px;height:15px;border:2.5px solid var(--gray-soft);
        border-top-color:var(--green);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

  .seg{display:inline-flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:7px 15px;color:var(--ink-soft)}
  .seg button.on{background:var(--green);color:#fff;font-weight:600}
  .foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
        color:var(--ink-soft);font-size:.88rem}
  .hide{display:none}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="brand">Recall<span>Check</span>
      <span style="font-weight:400;color:var(--ink-soft);font-size:.86rem;margin-left:5px">암기 채점기</span></div>
    <div class="crumbs" id="crumbs"></div>
  </div>
</header>
<div class="wrap"><div id="app"></div>
  <div class="foot">편집 거리(레벤슈타인) 알고리즘으로 채점합니다. 채점은 AI가 아니라 계산이라, 같은 답이면 언제나 같은 점수가 나옵니다.</div>
</div>
<input type="file" id="fileInput" accept=".txt,.tsv,.csv,.md,.json" class="hide">
<input type="file" id="photoInput" accept="image/*,application/pdf" multiple class="hide">
<input type="file" id="camInput" accept="image/*" capture="environment" class="hide">

<script>
/* =========================================================
   0. 저장소 (클로드 아티팩트 / 로컬 파일 / 메모리 모두 대응)
   ========================================================= */
const Store=(()=>{
  const KEY='memgrader:sets'; let mem=null;
  const hasW = typeof window!=='undefined' && window.storage && typeof window.storage.get==='function';
  let hasLS=false; try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); hasLS=true; }catch(e){}
  return {
    async load(){
      if(hasW){ try{ const r=await window.storage.get(KEY); return r&&r.value?JSON.parse(r.value):null; }catch(e){ return null; } }
      if(hasLS){ try{ const v=localStorage.getItem(KEY); return v?JSON.parse(v):null; }catch(e){ return null; } }
      return mem;
    },
    async save(sets){
      const s=JSON.stringify(sets); mem=sets;
      if(hasW){ try{ await window.storage.set(KEY,s); return; }catch(e){} }
      if(hasLS){ try{ localStorage.setItem(KEY,s); }catch(e){} }
    }
  };
})();

/* =========================================================
   1. 채점 엔진 — 가중 편집 거리, 라이브러리 없이 직접 구현
      기본은 레벤슈타인이고, 핵심 요소·숫자·기호에 더 큰 비용을 준다.
   ========================================================= */
function normalize(s){ return String(s==null?'':s).replace(/\s+/g,' ').trim(); }

const PRESETS={
  general:{label:'일반 서술형',  unit:'word',keepCase:false,keepPunct:false,numStrict:true, symFatal:false,strict:'normal'},
  english:{label:'영어 단어·문장',unit:'word',keepCase:false,keepPunct:false,numStrict:true, symFatal:false,strict:'normal'},
  math   :{label:'수학·기호',    unit:'char',keepCase:true, keepPunct:true, numStrict:true, symFatal:true, strict:'hard'},
  exact  :{label:'법조문·경전',  unit:'char',keepCase:true, keepPunct:true, numStrict:true, symFatal:true, strict:'hard'}
};
const BANDS={loose:[80,62],normal:[90,70],hard:[97,85]};
const STRICT_LABEL={loose:'관대',normal:'보통',hard:'엄격'};
const KW_COST=3, NUM_COST=2;
const PUNCT=/[.,!?;:'"\u201c\u201d\u2018\u2019()\[\]·…]/g;
const MATHSYM=/[+\-*/=<>±≤≥≠∑∫√^%]/;

function opts(s){
  s.opts=Object.assign({},PRESETS.general,s.opts||{});
  return s.opts;
}
function prep(s,o){
  let t=String(s==null?'':s);
  if(!o.keepCase) t=t.toLowerCase();
  if(!o.keepPunct) t=t.replace(PUNCT,' ');
  return t.replace(/\s+/g,' ').trim();
}
function tokensOf(t,unit){
  const out=[];
  if(unit==='char'){ for(let i=0;i<t.length;i++) if(t[i]!==' ') out.push({v:t[i],s:i,e:i+1}); }
  else { let i=0; t.split(' ').forEach(w=>{ if(w) out.push({v:w,s:i,e:i+w.length}); i+=w.length+1; }); }
  return out;
}
function keyMask(t,keys,o){
  const mask=new Array(t.length).fill(false);
  (keys||[]).forEach(k=>{
    const kk=prep(k,o); if(!kk) return;
    let from=0,i;
    while((i=t.indexOf(kk,from))>=0){ for(let j=i;j<i+kk.length;j++) mask[j]=true; from=i+kk.length; }
  });
  return mask;
}
function weightsOf(toks,mask,o){
  return toks.map(tk=>{
    for(let i=tk.s;i<tk.e;i++) if(mask[i]) return KW_COST;
    if(o.numStrict&&(/\d/.test(tk.v)||MATHSYM.test(tk.v))) return NUM_COST;
    return 1;
  });
}
// dp[i][j] = 정답 앞 i개를 내 답 앞 j개로 바꾸는 최소 편집 비용
function editOpsW(A,B,wA){
  const n=A.length,m=B.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=1;i<=n;i++) dp[i][0]=dp[i-1][0]+wA[i-1];
  for(let j=1;j<=m;j++) dp[0][j]=j;
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++){
    const same=A[i-1]===B[j-1];
    dp[i][j]=Math.min(
      dp[i-1][j-1]+(same?0:Math.max(wA[i-1],1)),   // 그대로 두기 / 바꿔 쓰기
      dp[i-1][j]+wA[i-1],                           // 빠뜨리기
      dp[i][j-1]+1                                  // 덧붙이기
    );
  }
  // 역추적: 어디를 고쳤는지 복원
  let i=n,j=m; const ops=[],path=[[n,m]];
  while(i>0||j>0){
    const same=i>0&&j>0&&A[i-1]===B[j-1];
    if(same&&dp[i][j]===dp[i-1][j-1]){ ops.push({t:'keep',a:A[i-1],b:B[j-1],w:wA[i-1]}); i--; j--; }
    else if(i>0&&j>0&&dp[i][j]===dp[i-1][j-1]+Math.max(wA[i-1],1)){ ops.push({t:'sub',a:A[i-1],b:B[j-1],w:wA[i-1]}); i--; j--; }
    else if(i>0&&dp[i][j]===dp[i-1][j]+wA[i-1]){ ops.push({t:'miss',a:A[i-1],w:wA[i-1]}); i--; }
    else { ops.push({t:'extra',b:B[j-1],w:1}); j--; }
    path.push([i,j]);
  }
  ops.reverse();
  return {cost:dp[n][m],dp,ops,path};
}
function charDist(a,b){
  const A=Array.from(a),B=Array.from(b),n=A.length,m=B.length;
  const d=Array.from({length:n+1},(_,i)=>{const r=new Array(m+1).fill(0);r[0]=i;return r;});
  for(let j=0;j<=m;j++) d[0][j]=j;
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++)
    d[i][j]=A[i-1]===B[j-1]?d[i-1][j-1]:1+Math.min(d[i-1][j-1],d[i-1][j],d[i][j-1]);
  return d[n][m];
}
// 무엇을 틀렸는지 이름 붙이기
function classify(op){
  if(op.t==='miss')  return op.w>=KW_COST?{k:'key',label:'핵심 요소 빠짐',lv:'red'}:{k:'miss',label:'빠짐',lv:'red'};
  if(op.t==='extra') return {k:'extra',label:'군더더기',lv:'gray'};
  const a=op.a,b=op.b;
  if(MATHSYM.test(a)||MATHSYM.test(b)) return {k:'sym',label:'기호 오류',lv:'red'};
  if(/\d/.test(a)||/\d/.test(b))       return {k:'num',label:'숫자 오류',lv:'red'};
  if(op.w>=KW_COST)                    return {k:'key',label:'핵심 요소 오류',lv:'red'};
  const d=charDist(a,b), len=Math.max(Array.from(a).length,Array.from(b).length)||1;
  if(d<=1||d/len<=0.34) return {k:'spell',label:'표현 차이',lv:'yellow'};
  return {k:'word',label:'낱말 오류',lv:'red'};
}
function grade(correct,mine,o,keys){
  const ct=prep(correct,o), mt=prep(mine,o);
  const At=tokensOf(ct,o.unit), Bt=tokensOf(mt,o.unit);
  const A=At.map(t=>t.v), B=Bt.map(t=>t.v);
  const wA=weightsOf(At,keyMask(ct,keys,o),o);
  if(!A.length) return {sim:0,verdict:'오답',ops:[],errs:[],cost:0,A,B,dp:null,path:[]};
  const r=editOpsW(A,B,wA);
  const denom=Math.max(wA.reduce((x,y)=>x+y,0),B.length,1);
  const sim=Math.max(0,Math.round((1-r.cost/denom)*100));
  const errs=r.ops.filter(op=>op.t!=='keep').map(op=>Object.assign({},op,classify(op)));
  const band=BANDS[o.strict]||BANDS.normal;
  let verdict = !B.length?'오답' : sim>=band[0]?'정답' : sim>=band[1]?'거의 맞음':'오답';
  if(errs.some(e=>e.k==='key')&&verdict==='정답') verdict='거의 맞음';
  if(o.symFatal&&errs.some(e=>e.k==='sym'||e.k==='num')) verdict='오답';
  return {sim,verdict,ops:r.ops,errs,cost:r.cost,dp:r.dp,path:r.path,A,B};
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function parseFile(text){
  // 맨 앞이 #인 줄은 안내문으로 보고 무시 (양식 파일의 설명줄)
  const lines=text.replace(/\r\n/g,'\n').replace(/^\uFEFF/,'').split('\n')
                  .filter(l=>!/^\s*#/.test(l));
  const nonEmpty=lines.filter(l=>l.trim()!=='');
  const tabbed=nonEmpty.filter(l=>l.includes('\t')).length;
  if(nonEmpty.length && tabbed>=nonEmpty.length/2){        // 탭 구분(TSV)
    const items=[];
    for(const line of lines){
      if(!line.trim()) continue;
      const idx=line.indexOf('\t'); if(idx<0) continue;
      const q=line.slice(0,idx).trim(), a=line.slice(idx+1).replace(/\t/g,' ').trim();
      if(q&&a) items.push({q,a});
    }
    return items;
  }
  const blocks=[]; let cur=[];                              // 빈 줄로 구분
  for(const line of lines){
    if(!line.trim()){ if(cur.length){ blocks.push(cur); cur=[]; } } else cur.push(line);
  }
  if(cur.length) blocks.push(cur);
  const items=[];
  for(const bl of blocks){
    if(bl.length<2) continue;
    const q=bl[0].trim(), a=bl.slice(1).join(' ').trim();
    if(q&&a) items.push({q,a});
  }
  return items;
}

function answerLines(ans){
  const len=normalize(ans).length;
  return Math.max(2,Math.min(9,Math.ceil(len/26)+1));
}
function download(name,text,mime){
  const b=new Blob(['\uFEFF'+text],{type:mime||'text/plain;charset=utf-8'});
  const u=URL.createObjectURL(b), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u);},600);
}

function whenStr(ms){
  const d=new Date(ms), now=new Date();
  const sameDay=d.toDateString()===now.toDateString();
  const hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return sameDay?('오늘 '+hm):((d.getMonth()+1)+'. '+d.getDate()+'. '+hm);
}

/* ---------- 채점 결과 (테스트·사진 공용) ---------- */
function gradeAll(answers,title){
  const s=activeSet(), o=opts(s);
  state.results=state.order.map((oi,k)=>{
    const g=grade(s.items[oi].a,answers[k]||'',o,s.items[oi].key);
    return Object.assign({oi,q:s.items[oi].q,correct:s.items[oi].a,mine:answers[k]||''},g);
  });
  s.wrong=state.results.filter(r=>r.verdict!=='정답').map(r=>r.oi);
  // 한 번이라도 100%로 맞힌 문항은 따로 기억해 둔다
  s.perfect=s.perfect||[];
  state.results.forEach(r=>{ if(r.sim===100&&s.perfect.indexOf(r.oi)<0) s.perfect.push(r.oi); });
  // 최근 3회 기록
  const ok=state.results.filter(r=>r.verdict==='정답').length;
  s.history=[{at:Date.now(),title,n:state.results.length,ok,
    avg:Math.round(state.results.reduce((a,r)=>a+r.sim,0)/(state.results.length||1)),
    items:state.results.map(r=>({i:r.oi,v:r.verdict,sim:r.sim}))}]
    .concat(s.history||[]).slice(0,3);
  persist();
  state.resultTitle=title;
  go('result');
}

function diffHTML(ops,unit,side){
  return ops.map((o,i)=>{
    if(o.t==='keep')  return esc(side==='mine'?o.b:o.a);
    if(o.t==='sub')   return `<span class="sub" title="${esc(o.label||'')}">${esc(side==='mine'?o.b:o.a)}</span>`;
    if(o.t==='extra') return side==='mine'?`<span class="extra">${esc(o.b)}</span>`:'';
    return side==='mine'?`<span class="miss" title="빠진 부분">＿</span>`:`<span class="miss">${esc(o.a)}</span>`;
  }).filter(x=>x!=='').join(unit==='char'?'':' ');
}
function errList(errs){
  if(!errs.length) return '<div class="okline">다른 곳이 없습니다.</div>';
  const shown=errs.filter(e=>e.k!=='extra'), extra=errs.filter(e=>e.k==='extra');
  let h='<div class="errhead">'+errs.length+'곳이 다릅니다</div><ul class="errs">';
  shown.forEach(e=>{
    h+='<li class="'+e.lv+'"><span class="tag">'+esc(e.label)+'</span>'+
       (e.t==='miss'
         ? '<b>'+esc(e.a)+'</b> 를 쓰지 않았어요'
         : '<b>'+esc(e.a)+'</b> 를 <s>'+esc(e.b)+'</s> 로 썼어요')+'</li>';
  });
  if(extra.length) h+='<li class="gray"><span class="tag">군더더기</span>정답에 없는 말: '+
    extra.map(e=>'<s>'+esc(e.b)+'</s>').join(', ')+'</li>';
  return h+'</ul>';
}

// DP 표 + 최소 편집 경로
function dpTable(r){
  const {dp,A,B,path}=r;
  const on=new Set(path.map(p=>p[0]+','+p[1]));
  let h='<table class="dp"><tr><th></th><th>∅</th>'+B.map(b=>'<th>'+esc(b)+'</th>').join('')+'</tr>';
  for(let i=0;i<=A.length;i++){
    h+='<tr><th>'+(i===0?'∅':esc(A[i-1]))+'</th>';
    for(let j=0;j<=B.length;j++) h+='<td class="'+(on.has(i+','+j)?'path':'')+'">'+dp[i][j]+'</td>';
    h+='</tr>';
  }
  return h+'</table><div style="color:var(--ink-soft);font-size:.86rem;margin-top:6px">'+
    '세로는 정답, 가로는 내가 쓴 답. 초록 칸이 최소 편집 경로예요. 오른쪽 맨 아래 값이 최소 편집 비용 '+r.cost+'입니다. '+
    '핵심 요소는 '+KW_COST+', 숫자·기호는 '+NUM_COST+', 나머지는 1의 비용을 씁니다.</div>';
}

function buildSheet(withAnswer){
  const s=activeSet();

  const title=s.name+(withAnswer?' — 답안 포함':' — 답안지');
  let body='';
  idx.forEach((oi,k)=>{
    const it=s.items[oi];
    body+='<div class="qa"><p class="q"><span class="no">'+(k+1)+'.</span>'+esc(it.q)+'</p>';
    if(withAnswer){
      body+='<p class="a">'+esc(it.a)+'</p>';
    }else{

/* =========================================================
   6. 사진으로 채점 — AI는 손글씨를 옮겨 적기만, 채점은 편집 거리
   ========================================================= */
async function readFileB64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(String(r.result).split(',')[1]);
    r.onerror=()=>rej(new Error('파일을 읽지 못했어요'));
    r.readAsDataURL(file);
  });
}

async function callClaude(content,key){
  const headers={'Content-Type':'application/json'};
  if(key){
    headers['x-api-key']=key;
    headers['anthropic-version']='2023-06-01';
    headers['anthropic-dangerous-direct-browser-access']='true';
  }
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',headers,
    body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content}]})
  });
  if(!res.ok){
    const t=await res.text().catch(()=>'');
    throw new Error('요청 실패 ('+res.status+') '+t.slice(0,160));
  }
  const data=await res.json();
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}

function looseJSON(text){
  let t=String(text).replace(/```json|```/g,'').trim();
  const s=t.indexOf('{'); if(s>=0) t=t.slice(s);
  try{ return JSON.parse(t); }catch(e){}
  const cut=t.lastIndexOf('",');
  if(cut>0){ try{ return JSON.parse(t.slice(0,cut+1)+'}'); }catch(e){} }
  const obj={}; const re=/"(\d+)"\s*:\s*"((?:[^"\\]|\\.)*)"/g; let m;
  while((m=re.exec(t))) obj[m[1]]=m[2].replace(/\\"/g,'"');
  return Object.keys(obj).length?obj:null;
}

async function transcribe(){
  const s=activeSet(), p=state.photo;
  if(!p.files.length){ alert('먼저 답안지 사진이나 PDF를 올려주세요.'); return; }
  p.busy=true; p.msg='사진에서 손글씨를 옮겨 적는 중'; render();

  // 문항 번호와 질문만 알려줌. 정답은 절대 보내지 않아야 AI가 답을 "고쳐" 적지 않음.
  const qlist=state.order.map((oi,k)=>(k+1)+'. '+s.items[oi].q).join('\n');
  const rule=
    '이 이미지는 학생이 손으로 쓴 답안지야. 번호별로 학생이 쓴 답을 보이는 그대로 옮겨 적어.\n'+
    '규칙: 맞춤법이나 내용을 고치지 말 것. 빠진 말을 채워 넣지 말 것. '+
    '알아볼 수 없는 글자는 ?로 표시. 비어 있는 번호는 아예 넣지 말 것.\n'+
    '설명 없이 JSON만 출력해. 형식: {"1":"학생이 쓴 답","2":"..."}\n\n'+
    '문항 목록(참고용, 여기에 정답은 없음):\n'+qlist;

  try{
    for(let i=0;i<p.files.length;i++){
      const f=p.files[i];
      p.msg='옮겨 적는 중 ('+(i+1)+'/'+p.files.length+')'; render();
      const b64=await readFileB64(f);
      const block = f.type==='application/pdf'
        ? {type:'document',source:{type:'base64',media_type:'application/pdf',data:b64}}
        : {type:'image',source:{type:'base64',media_type:f.type||'image/jpeg',data:b64}};
      const out=await callClaude([block,{type:'text',text:rule}],p.key);
      const obj=looseJSON(out);
      if(!obj) throw new Error('결과를 읽지 못했어요. 사진이 흐리거나 글씨가 잘렸을 수 있어요.');
      Object.keys(obj).forEach(kk=>{
        const n=parseInt(String(kk).replace(/[^0-9]/g,''),10);
        const v=String(obj[kk]==null?'':obj[kk]).trim();
        if(n>=1&&n<=p.rows.length&&v) p.rows[n-1]=v;
      });
    }
    p.done=true; p.msg='';
  }catch(e){
    p.msg=''; p.err=e.message;
  }
  p.busy=false; render();
}

/* =========================================================
   7. 입력 연결 · 예제 · 시작
   ========================================================= */
const fileInput=document.getElementById('fileInput');
const photoInput=document.getElementById('photoInput');
const camInput=document.getElementById('camInput');

function importSets(arr){
  let n=0;
  arr.forEach(s=>{
    if(!s||!Array.isArray(s.items)||!s.items.length) return;
    const items=s.items.filter(it=>it&&it.q&&it.a);
    if(!items.length) return;
    state.sets.push({name:String(s.name||'가져온 세트'),items,
      wrong:s.wrong||[],perfect:s.perfect||[],history:(s.history||[]).slice(0,3),opts:s.opts});
    n++;
  });
  return n;
}

fileInput.onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  const text=await f.text();
  if(/\.json$/i.test(f.name)||/^\s*\[/.test(text)){        // 세트 묶음 파일
    let arr=null; try{ arr=JSON.parse(text); }catch(err){}
    if(!Array.isArray(arr)){ alert('세트 파일을 읽지 못했어요. 내보내기로 만든 .json인지 확인해 주세요.'); }
    else{
      const n=importSets(arr);
      if(!n) alert('가져올 세트가 없었어요.');
      else { await persist(); render(); }
    }
    fileInput.value=''; return;
  }
  const items=parseFile(text);
  if(!items.length){ alert('질문·답안 쌍을 찾지 못했어요. 빈 줄 구분이나 탭 구분 형식인지 확인해 주세요.'); }
  else{
    state.sets.push({name:f.name.replace(/\.[^.]+$/,''),items,wrong:[]});
    await persist(); render();
  }
  fileInput.value='';
};
function addPhotos(list){
  const p=state.photo;
  p.files=p.files.concat([...list]); p.err=''; render();
}
photoInput.onchange=e=>{ if(e.target.files.length) addPhotos(e.target.files); photoInput.value=''; };
camInput.onchange=e=>{ if(e.target.files.length) addPhotos(e.target.files); camInput.value=''; };

(async()=>{
  const saved=await Store.load();
  if(saved&&Array.isArray(saved)) state.sets=saved;
  // 웹에 올린 경우, 같은 폴더의 sets.json 을 기본 세트로 읽어온다.

      const res=await fetch('sets.json',{cache:'no-store'});
      if(res.ok){
        const arr=await res.json();
        if(Array.isArray(arr)&&importSets(arr)) await persist();
      }
    }catch(err){}
  }
  render();
})();
